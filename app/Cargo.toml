[package]
name = "originfx-app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "OriginFX: free, open-source professional video editing"

[[bin]]
name = "originfx"
path = "src/main.rs"

[features]

[dependencies]
slint = "1.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.18"
hound = "3"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
open = "5"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
quick-xml = "0.37"

originfx-media-engine = { path = "../crates/media-engine" }
originfx-timeline-engine = { path = "../crates/timeline-engine", features = ["media"] }
originfx-render-engine = { path = "../crates/render-engine" }
originfx-audio-engine = { path = "../crates/audio-engine" }
originfx-effects-engine = { path = "../crates/effects-engine" }
originfx-plugin-engine = { path = "../crates/plugin-engine", features = ["example"] }
originfx-motion-graphics-engine = { path = "../crates/motion-graphics-engine" }
trash = "5"
arboard = "3"

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
