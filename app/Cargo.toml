[package]
name = "originfx-welcome"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "OriginFX app: first-run setup (Choose your workspace, steps 1 to 3)"

[[bin]]
name = "originfx"
path = "src/main.rs"

[[bin]]
name = "snapshot"
path = "src/bin/snapshot.rs"
required-features = ["snapshot"]

[features]
snapshot = []

[dependencies]
slint = "1.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Fast profile for the headless snapshot tool (development only).
[profile.snap]
inherits = "release"
lto = false
strip = false
incremental = true
codegen-units = 16
