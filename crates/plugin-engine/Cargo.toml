[package]
name = "originfx-plugin-engine"
description = "OriginFX Plugin Engine: sandboxed WebAssembly plugins that add picture effects"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "plugin_engine"

[features]
# A tiny example plugin (compiled from text at run time) for trying and testing the host.
example = ["dep:wat"]

[dependencies]
wasmi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wat = { version = "1", optional = true }

[dev-dependencies]
wat = "1"
tempfile = "3"
