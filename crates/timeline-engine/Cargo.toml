[package]
name = "originfx-timeline-engine"
description = "OriginFX Timeline Engine: the project model, edit operations, undo/redo and project files"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "timeline_engine"

[features]
# Reading durations and formats from real files through the Media Engine.
# Off by default so the engine itself stays pure Rust and builds without FFmpeg.
media = ["dep:originfx-media-engine"]

[dependencies]
im = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
originfx-media-engine = { path = "../media-engine", optional = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"
