[package]
name = "originfx-cli"
description = "Command line front-end for the OriginFX engines"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "originfx"
path = "src/main.rs"

[dependencies]
originfx-media-engine = { path = "../media-engine" }
originfx-render-engine = { path = "../render-engine" }
originfx-timeline-engine = { path = "../timeline-engine", features = ["media"] }
clap = { version = "4", features = ["derive"] }
