name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04 # ships FFmpeg 6.1, which the ffmpeg-next 6.1 bindings target
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libswresample-dev libavfilter-dev libavdevice-dev \
            libx264-dev libx265-dev clang libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          set +e
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the failure text as annotations so it is visible without the raw log.
            grep -vE '^\s*(Compiling|Checking|Fresh|Downloaded|Downloading)' clippy.log | head -40 \
              | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit "$status"

      - name: Test
        run: cargo test --workspace
