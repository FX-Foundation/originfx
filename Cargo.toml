[workspace]
resolver = "2"
members = ["crates/media-engine", "crates/timeline-engine", "crates/audio-engine", "crates/keyframe-engine", "crates/effects-engine", "crates/render-engine", "crates/originfx-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
repository = "https://github.com/FX-Foundation/originfx"
authors = ["FX Foundation"]
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
